<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0604" />
    <title>Księga Magicznych Opowieści · 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #e2bf74;
        --gold-hi: #f6dd9c;
        --gold-lo: #9c7232;
        --fillet: rgba(214, 172, 96, 0.5);
        --ink: #2a160a;
        --text: #f1e2c2;
        --parchment: #efe0bd;
        /* calm, warm storybook motion: one curve for most things, a softer one for arrivals */
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-out: cubic-bezier(0.2, 0, 0, 1);
        --h: 40px; /* plaque height; every control's hit area is still 44 px (see .ctl::after) */
        --r: 13px; /* plaque radius; everything inside is concentric with it */
        --pad: 3px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0604;
        color: var(--text);
        font-family: "EB Garamond", Georgia, serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      /* soft vignette and a whisper of warmth from the candle corner */
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(ellipse 118% 98% at 50% 48%, transparent 58%, rgba(8, 3, 1, 0.6) 100%),
          radial-gradient(circle at 0% 0%, rgba(255, 150, 60, 0.09), transparent 38%);
      }
      #veil {
        position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 10px;
        background: #0b0604; transition: opacity 1.4s var(--ease); pointer-events: none;
        color: rgba(241, 226, 194, 0.6); font-size: 21px; font-style: italic; letter-spacing: 0.03em;
      }
      #veil::after { content: "❦"; font-style: normal; font-size: 18px; color: rgba(226, 191, 116, 0.45); }
      #veil.gone { opacity: 0; }

      /* ---------- controls: small tooled-leather plaques with a gilt fillet ---------- */
      .chrome {
        position: fixed; z-index: 10; display: flex; align-items: center; gap: 10px;
        transition-property: opacity, translate; transition-duration: 0.7s; transition-timing-function: var(--ease-out);
      }
      .chrome.hidden { opacity: 0; translate: 0 -6px; pointer-events: none; }
      .chrome.bottom.hidden { translate: 0 6px; }
      .chrome.bottom { transition-delay: 0.12s; }
      .top { top: max(6px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
      /* landscape: page controls in the bottom-right corner, so the ribbons hanging under the
         spine stay free to tap; portrait: centred under the page */
      .bottom { bottom: max(6px, env(safe-area-inset-bottom)); right: max(10px, env(safe-area-inset-right)); }
      html[data-layout="portrait"] .bottom { right: auto; left: 50%; transform: translateX(-50%); }

      .plaque {
        position: relative; display: flex; align-items: center; height: var(--h);
        border-radius: var(--r);
        background:
          radial-gradient(130% 120% at 30% -10%, rgba(255, 214, 150, 0.13), transparent 55%),
          linear-gradient(180deg, rgba(58, 36, 22, 0.7), rgba(30, 17, 9, 0.84)),
          url("../assets/book3d/textures/leather_diff.webp") center / 220px;
        background-blend-mode: normal, multiply, normal;
        /* shadows for elevation; the ring is the plaque's own dark edge */
        --lift-shadow: 0 2px 3px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.32);
        box-shadow:
          0 0 0 1px rgba(8, 4, 2, 0.9),
          inset 0 1px 0 rgba(255, 222, 168, 0.16),
          inset 0 -1px 0 rgba(0, 0, 0, 0.4),
          var(--lift-shadow);
        transition: translate 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
      }
      /* the gilt fillet tooled just inside the edge (concentric: r - pad) */
      .plaque::before {
        content: ""; position: absolute; inset: var(--pad); border-radius: calc(var(--r) - var(--pad));
        box-shadow: inset 0 0 0 1px var(--fillet); pointer-events: none;
        transition: box-shadow 0.25s var(--ease-out);
      }
      .plaque.round { width: var(--h); border-radius: 50%; justify-content: center; }
      .plaque.round::before { border-radius: 50%; }

      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      .ctl {
        position: relative; z-index: 1; display: grid; place-items: center;
        min-width: 44px; height: var(--h); border-radius: calc(var(--r) - var(--pad));
        color: var(--gold);
        transition-property: color, scale, opacity; transition-duration: 0.15s; transition-timing-function: ease-out;
      }
      /* 44 x 44 px touch target round the smaller visible control */
      .ctl::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: 44px; translate: -50% -50%; }
      .ctl:active:not(:disabled, [aria-disabled="true"]) { scale: 0.96; }
      /* the next arrow held at a choice looks disabled, yet stays a button (a press shows why);
         once the reader has chosen it wakes: a glint of gold and a small nudge onwards */
      .ctl:disabled, .ctl[aria-disabled="true"] { opacity: 0.32; cursor: default; }
      .ctl.wake { animation: wake 0.6s var(--ease-out); }
      @keyframes wake {
        0% { opacity: 0.32; }
        40% { opacity: 1; color: var(--gold-hi); filter: drop-shadow(0 0 5px rgba(246, 221, 156, 0.65)); translate: 2px 0; }
        100% { opacity: 1; }
      }
      .ctl:focus-visible, .round:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; color: var(--gold-hi); }
      .nav .ctl:focus-visible { outline-offset: 0; } /* the narrow arrows: the ring stays clear of the label */
      .ctl svg { width: 20px; height: 20px; }

      /* language: a gold-leaf label slides under the chosen language */
      .seg { padding: 0 var(--pad); }
      .seg .thumb {
        position: absolute; top: var(--pad); bottom: var(--pad); left: var(--pad); width: calc(50% - var(--pad));
        border-radius: calc(var(--r) - var(--pad));
        background: linear-gradient(160deg, #f7e1a2 0%, #d7ac58 42%, #a8792f 70%, #e6c477 100%);
        box-shadow: inset 0 1px 0 rgba(255, 248, 220, 0.6), inset 0 -1px 1px rgba(80, 45, 10, 0.5), 0 1px 2px rgba(0, 0, 0, 0.45);
        transition: translate 0.32s var(--ease);
      }
      .seg[data-lang="en"] .thumb { translate: 100% 0; }
      /* small caps stand on the baseline, about 0.1em below the middle of EB Garamond's line box:
         lift them by that, so the letters have the same room above and below on the gold leaf */
      .seg .ctl { width: 46px; padding-bottom: 0.2em; font-weight: 600; font-size: 17px; letter-spacing: 0.08em; font-variant-caps: all-small-caps; }
      .seg .ctl[aria-pressed="true"] { color: var(--ink); text-shadow: 0 1px 0 rgba(255, 240, 200, 0.45); }

      /* page controls: Wstęp, a page number, Koniec. The label fits the widest word of its language
         (Koniec, The End), so the plaque never shifts as pages turn; the arrows stand in narrow
         columns, their 44 px touch targets reaching over the padding and the label (which lets
         every tap through to them) */
      .nav { padding: 0 var(--pad); gap: 0; }
      .nav .ctl { min-width: 32px; }
      #indicator {
        position: relative; z-index: 1; min-width: 3em; padding: 0 4px; text-align: center; white-space: nowrap; pointer-events: none;
        font-size: 18px; font-style: italic; color: var(--text);
        font-variant-numeric: tabular-nums lining-nums;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
      }
      html[lang="en"] #indicator { min-width: 3.75em; }
      /* the length of the tale, quieter than the page being read */
      #indicator .of { margin-left: 0.3em; font-size: 15px; color: rgba(241, 226, 194, 0.58); }
      #indicator .of:empty { display: none; }
      /* a gilt hairline under the words: how far into the tale */
      #indicator::after {
        content: ""; position: absolute; left: 12%; bottom: -1px; height: 1px; width: calc(76% * var(--progress, 0));
        background: linear-gradient(90deg, rgba(226, 191, 116, 0.1), rgba(226, 191, 116, 0.6));
        transition: width 0.6s var(--ease);
      }

      /* ---------- hover: a control under the pointer rises a hair and warms, and light runs once
         along its gilt. Desktop only (no sticky hover after a tap); keyboard focus gets the same,
         so a control reads alike however it is reached; a press sets the plaque back down.
         One pattern for every plaque (language, pages, a sound toggle to come) and its controls;
         the clasp on the last page rises and warms the same way. ---------- */
      .plaque::after {
        /* the glint: a soft band of candlelight, parked past the left edge until it runs */
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 224, 160, 0.2) 50%, transparent 62%) 100% 0 / 250% 100% no-repeat;
      }
      @keyframes glint {
        from { opacity: 1; background-position: 100% 0; }
        to { opacity: 1; background-position: 0 0; }
      }
      @media (hover: hover) and (pointer: fine) {
        .plaque:hover { translate: 0 -1px; --lift-shadow: 0 3px 4px rgba(0, 0, 0, 0.38), 0 12px 24px rgba(0, 0, 0, 0.36); }
        .plaque:hover::before { box-shadow: inset 0 0 0 1px rgba(236, 200, 128, 0.78); }
        .plaque:hover::after { animation: glint 0.8s var(--ease-out); }
        .ctl:hover:not(:disabled, [aria-disabled="true"], [aria-pressed="true"]) { color: var(--gold-hi); filter: drop-shadow(0 0 4px rgba(246, 221, 156, 0.4)); }
      }
      .plaque:has(:focus-visible) { translate: 0 -1px; --lift-shadow: 0 3px 4px rgba(0, 0, 0, 0.38), 0 12px 24px rgba(0, 0, 0, 0.36); }
      .plaque:has(:focus-visible)::before { box-shadow: inset 0 0 0 1px rgba(236, 200, 128, 0.78); }
      .plaque:has(:focus-visible)::after { animation: glint 0.8s var(--ease-out); }
      .plaque:has(.ctl:active:not(:disabled, [aria-disabled="true"])) { translate: 0 0; --lift-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 5px 14px rgba(0, 0, 0, 0.3); }

      #perf {
        position: fixed; top: 10px; left: 10px; z-index: 30; padding: 6px 9px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.6); color: #cfe8c8; font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none;
      }
      /* screen-reader mirror of the spread; its buttons (choices, tale ribbons) surface when
         focused by keyboard, as small parchment labels above the page controls */
      .sr-only {
        position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      #mirror .choices button:focus, #taleNav button:focus {
        position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 40;
        width: max-content; max-width: min(86vw, 520px); height: auto; clip: auto; white-space: normal; margin: 0;
        padding: 11px 18px 11px 34px; border-radius: 10px; text-align: left;
        background: linear-gradient(180deg, #f4e7c8, #e4d0a4); color: var(--ink);
        box-shadow: 0 0 0 1px rgba(120, 82, 30, 0.55), inset 0 0 0 3px rgba(244, 231, 200, 0.9), inset 0 0 0 4px rgba(176, 128, 52, 0.55), 0 8px 22px rgba(0, 0, 0, 0.45);
        font: 600 18px/1.25 "EB Garamond", serif; outline: none;
      }
      #mirror .choices button:focus::before, #taleNav button:focus::before {
        content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; translate: 0 -50%; rotate: 45deg;
        background: var(--ribbon, #962a1f); box-shadow: 0 0 0 1px rgba(176, 128, 52, 0.8);
      }
      #mirror .choices, #taleNav { position: static; }

      /* ---------- the clasp: "begin again" on a tale's last page. The page prints it, so it rides
         the leaf through every turn; once the page lies still, a real button is raised over the
         print (main.js lays it onto the page as the camera sees it): a sibling of the language
         label, the same gold leaf and corners, lit along its top, shaded at its foot, standing off
         the paper on its own shadow. Under the pointer (or when its line in the mirror has
         keyboard focus) it rises and warms; pressed, it sinks back onto the page.
         Steady by construction: the button's box never moves (only the face inside it rises, so
         the pointer cannot slip off its edge), its hover has a little give, it sits on a layer of
         its own, and every change is opacity or transform, nothing that redraws it. Under the vignette, like the rest of the desk. */
      #clasp {
        position: fixed; left: 0; top: 0; z-index: 1; transform-origin: 0 0; will-change: transform;
        /* gone at once when the page moves (never left floating over a turning leaf), fading in
           as the page comes to rest */
        opacity: 0; visibility: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #clasp.shown { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease-out); }
      /* hover with a little give: once under the pointer, the button reaches 8 px further, so the
         camera's slow breath (the page drifts a few px) never carries its edge out from under a
         resting pointer */
      #clasp::after { content: ""; position: absolute; inset: 0; }
      #clasp:hover::after { inset: -8px; }
      #clasp .face {
        position: absolute; inset: 0; border-radius: var(--clasp-r, 13px);
        background: linear-gradient(160deg, #f7e1a2 0%, #d7ac58 42%, #a8792f 70%, #e6c477 100%);
        box-shadow:
          0 0 0 1px rgba(110, 70, 25, 0.45),
          inset 0 1px 0 rgba(255, 248, 220, 0.6), inset 0 -1px 1px rgba(80, 45, 10, 0.45),
          0 1px 2px rgba(46, 22, 6, 0.42), 0 3px 6px rgba(46, 22, 6, 0.26);
        transition: translate 0.2s var(--ease-out);
      }
      /* the deeper shadow of a raised plate, and the warmth (or, pressed, the shade) on its leaf:
         faded in and out, never redrawn */
      #clasp .face::before, #clasp .face::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; pointer-events: none;
        transition: opacity 0.2s var(--ease-out);
      }
      #clasp .face::before { box-shadow: 0 3px 3px rgba(46, 22, 6, 0.3), 0 8px 14px rgba(46, 22, 6, 0.3); }
      #clasp .face::after { background: rgba(255, 238, 190, 0.18); }
      #clasp svg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; }
      #clasp text { font-family: "EB Garamond", serif; font-weight: 600; font-kerning: none; }
      #clasp text.ink { fill: var(--ink); }
      #clasp text.edge { fill: rgba(255, 240, 200, 0.45); }
      @media (hover: hover) and (pointer: fine) {
        #clasp:hover .face { translate: 0 -1px; }
        #clasp:hover .face::before, #clasp:hover .face::after { opacity: 1; }
      }
      #clasp.focus .face { translate: 0 -1px; }
      #clasp.focus .face::before, #clasp.focus .face::after { opacity: 1; }
      #clasp:active .face { translate: 0 0.5px; transition-duration: 0.06s; }
      #clasp:active .face::before { opacity: 0; transition-duration: 0.06s; }
      #clasp:active .face::after { opacity: 1; background: rgba(70, 40, 10, 0.12); transition-duration: 0.06s; }

      @media (prefers-reduced-motion: reduce) {
        .chrome, .chrome.hidden, .chrome.bottom.hidden { translate: none; transition-property: opacity; }
        .seg .thumb, #indicator::after { transition-duration: 0.01s; }
        .ctl.wake { animation: none; }
        /* raised controls only warm: no rise, no running light */
        .plaque, .plaque:hover, .plaque:has(:focus-visible) { translate: none; }
        .plaque::after { animation: none !important; }
        #clasp .face, #clasp:hover .face, #clasp.focus .face, #clasp:active .face { translate: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <!-- raised over the printed clasp on a tale's last page (main.js); screen readers and the
         keyboard use the restart button in the mirror instead -->
    <button type="button" id="clasp" aria-hidden="true" tabindex="-1"></button>
    <div id="vignette"></div>

    <div class="chrome top hidden" id="chromeTop">
      <div class="plaque seg" role="group" id="langGroup" aria-label="Język" data-lang="pl">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" class="ctl" data-lang="pl" aria-pressed="true">PL</button>
        <button type="button" class="ctl" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <nav class="chrome bottom hidden" id="chromeBottom" aria-label="Strony">
      <div class="plaque nav">
        <button type="button" class="ctl" id="prev" aria-label="Poprzednia strona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5" /></svg>
        </button>
        <span id="indicator" aria-live="polite"><span id="pageSr" class="sr-only">Strona tytułowa</span><span aria-hidden="true"><span id="pageNow">Wstęp</span><span id="pageOf" class="of"></span></span></span>
        <button type="button" class="ctl" id="next" aria-label="Następna strona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" /></svg>
        </button>
      </div>
    </nav>

    <main id="mirror" class="sr-only" aria-live="polite"></main>
    <nav id="taleNav" class="sr-only"></nav>
    <div id="veil">Księga Magicznych Opowieści</div>
    <div id="perf" hidden></div>

    <script type="module" src="./book/main.js"></script>
  </body>
</html>
