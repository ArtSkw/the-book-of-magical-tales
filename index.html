    <!-- EB Garamond (SIL OFL 1.1, public/fonts/OFL.txt), served from the site itself: the same
         variable-font files Google Fonts serves, split as it splits them (latin, and latin-ext
         trimmed to Latin Extended-A for Polish), so the type sets exactly as before. Every face is
         needed before the book opens (the pages are drawn in it), so all four load at once. -->
    <link rel="preload" href="/fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/eb-garamond-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/eb-garamond-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/eb-garamond-italic-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "EB Garamond"; font-style: normal; font-weight: 400 600; font-display: swap;
        src: url("/fonts/eb-garamond-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-017F;
      }
      @font-face {
        font-family: "EB Garamond"; font-style: normal; font-weight: 400 600; font-display: swap;
        src: url("/fonts/eb-garamond-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "EB Garamond"; font-style: italic; font-weight: 400 600; font-display: swap;
        src: url("/fonts/eb-garamond-italic-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-017F;
      }
      @font-face {
        font-family: "EB Garamond"; font-style: italic; font-weight: 400 600; font-display: swap;
        src: url("/fonts/eb-garamond-italic-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --gold: #e2bf74;
        --gold-hi: #f6dd9c;
        --gold-lo: #9c7232;
        --fillet: rgba(214, 172, 96, 0.5);
        --ink: #2a160a;
        --text: #f1e2c2;
        --parchment: #efe0bd;
        /* calm, warm storybook motion: one curve for most things, a softer one for arrivals */
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-out: cubic-bezier(0.2, 0, 0, 1);
        --h: 40px; /* plaque height; every control's hit area is still 44 px (see .ctl::after) */
        --r: 13px; /* plaque radius; everything inside is concentric with it */
        --pad: 3px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0604;
        color: var(--text);
        font-family: "EB Garamond", Georgia, serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      /* soft vignette and a whisper of warmth from the candle corner */
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(ellipse 118% 98% at 50% 48%, transparent 58%, rgba(8, 3, 1, 0.6) 100%),
          radial-gradient(circle at 0% 0%, rgba(255, 150, 60, 0.09), transparent 38%);
      }
      /* ---------- the loader: a small gold roundel like the emblems of the title pages. A wreath
         of four-pointed stars turns one way, the rosette at its heart the other, and a glint runs
         round the gold-leaf ring; each turning layer is an svg of its own, so it keeps turning
         smoothly while the desk is being built. Once the desk is ready (main.js, liftVeil) the
         roundel swells a little and fades, its glow blooming out, while the veil lifts off the
         candle-lit desk and the book begins to open. ---------- */
      #veil {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: #0b0604; transition: opacity 1.2s var(--ease); pointer-events: none;
      }
      #veil.gone { opacity: 0; }
      #veil[hidden] { display: none; }
      .loader { position: relative; width: 84px; height: 84px; opacity: 0; animation: loader-in 0.5s var(--ease-out) 0.1s forwards; }
      /* a little candle warmth behind the gold */
      .loader::before {
        content: ""; position: absolute; inset: -70%; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(226, 191, 116, 0.13), rgba(226, 191, 116, 0.04) 60%, transparent);
        transition: transform 1.2s var(--ease-out), opacity 1.2s var(--ease-out);
      }
      .seal { position: absolute; inset: 0; transition: transform 0.8s var(--ease-out), opacity 0.6s var(--ease-out); }
      .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .seal .stars { animation: turn 6s linear infinite; }
      .seal .rosette { animation: turn 5s linear infinite reverse; }
      .seal .glint { animation: turn 4s linear infinite; }
      #veil.gone .seal { transform: scale(1.12); opacity: 0; }
      #veil.gone .loader::before { transform: scale(1.9); opacity: 0; }
      @keyframes loader-in { to { opacity: 1; } }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes breathe { from { opacity: 1; } to { opacity: 0.55; } }

      /* ---------- controls: small tooled-leather plaques with a gilt fillet ---------- */
      .chrome {
        position: fixed; z-index: 10; display: flex; align-items: center; gap: 10px;
        transition-property: opacity, translate; transition-duration: 0.7s; transition-timing-function: var(--ease-out);
      }
      .chrome.hidden { opacity: 0; translate: 0 -6px; pointer-events: none; }
      .chrome.bottom.hidden { translate: 0 6px; }
      .chrome.bottom { transition-delay: 0.12s; }
      .top { top: max(6px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
      /* landscape: page controls in the bottom-right corner, so the ribbons hanging under the
         spine stay free to tap; portrait: centred under the page */
      .bottom { bottom: max(6px, env(safe-area-inset-bottom)); right: max(10px, env(safe-area-inset-right)); }
      html[data-layout="portrait"] .bottom { right: auto; left: 50%; transform: translateX(-50%); }

      .plaque {
        position: relative; display: flex; align-items: center; height: var(--h);
        border-radius: var(--r);
        background:
          radial-gradient(130% 120% at 30% -10%, rgba(255, 214, 150, 0.13), transparent 55%),
          linear-gradient(180deg, rgba(58, 36, 22, 0.7), rgba(30, 17, 9, 0.84)),
          url("/assets/book3d/textures/leather_diff.webp") center / 220px;
        background-blend-mode: normal, multiply, normal;
        /* shadows for elevation; the ring is the plaque's own dark edge */
        --lift-shadow: 0 2px 3px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.32);
        box-shadow:
          0 0 0 1px rgba(8, 4, 2, 0.9),
          inset 0 1px 0 rgba(255, 222, 168, 0.16),
          inset 0 -1px 0 rgba(0, 0, 0, 0.4),
          var(--lift-shadow);
        transition: translate 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
      }
      /* the gilt fillet tooled just inside the edge (concentric: r - pad) */
      .plaque::before {
        content: ""; position: absolute; inset: var(--pad); border-radius: calc(var(--r) - var(--pad));
        box-shadow: inset 0 0 0 1px var(--fillet); pointer-events: none;
        transition: box-shadow 0.25s var(--ease-out);
      }
      .plaque.round { width: var(--h); border-radius: 50%; justify-content: center; }
      .plaque.round::before { border-radius: 50%; }

      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      .ctl {
        position: relative; z-index: 1; display: grid; place-items: center;
        min-width: 44px; height: var(--h); border-radius: calc(var(--r) - var(--pad));
        color: var(--gold);
        transition-property: color, scale, opacity; transition-duration: 0.15s; transition-timing-function: ease-out;
      }
      /* 44 x 44 px touch target round the smaller visible control */
      .ctl::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: 44px; translate: -50% -50%; }
      .ctl:active:not(:disabled, [aria-disabled="true"]) { scale: 0.96; }
      /* the next arrow held at a choice looks disabled, yet stays a button (a press shows why);
         once the reader has chosen it wakes: a glint of gold and a small nudge onwards */
      .ctl:disabled, .ctl[aria-disabled="true"] { opacity: 0.32; cursor: default; }
      .ctl.wake { animation: wake 0.6s var(--ease-out); }
      @keyframes wake {
        0% { opacity: 0.32; }
        40% { opacity: 1; color: var(--gold-hi); filter: drop-shadow(0 0 5px rgba(246, 221, 156, 0.65)); translate: 2px 0; }
        100% { opacity: 1; }
      }
      .ctl:focus-visible, .round:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; color: var(--gold-hi); }
      .nav .ctl:focus-visible { outline-offset: 0; } /* the narrow arrows: the ring stays clear of the label */
      .ctl svg { width: 20px; height: 20px; }

      /* language: a gold-leaf label slides under the chosen language */
      .seg { padding: 0 var(--pad); }
      .seg .thumb {
        position: absolute; top: var(--pad); bottom: var(--pad); left: var(--pad); width: calc(50% - var(--pad));
        border-radius: calc(var(--r) - var(--pad));
        background: linear-gradient(160deg, #f7e1a2 0%, #d7ac58 42%, #a8792f 70%, #e6c477 100%);
        box-shadow: inset 0 1px 0 rgba(255, 248, 220, 0.6), inset 0 -1px 1px rgba(80, 45, 10, 0.5), 0 1px 2px rgba(0, 0, 0, 0.45);
        transition: translate 0.32s var(--ease);
      }
      .seg[data-lang="en"] .thumb { translate: 100% 0; }
      /* small caps stand on the baseline, about 0.1em below the middle of EB Garamond's line box:
         lift them by that, so the letters have the same room above and below on the gold leaf */
      .seg .ctl { width: 46px; padding-bottom: 0.2em; font-weight: 600; font-size: 17px; letter-spacing: 0.08em; font-variant-caps: all-small-caps; }
      .seg .ctl[aria-pressed="true"] { color: var(--ink); text-shadow: 0 1px 0 rgba(255, 240, 200, 0.45); }

      /* sound: a round plaque beside the language, its 44 px touch target round the 40 px disc;
         on, the arcs of sound; off, a small cross, and the gold a little quieter */
      #soundToggle { min-width: 0; width: 100%; border-radius: 50%; }
      #soundToggle .mute { display: none; }
      #soundToggle[aria-pressed="false"] { color: rgba(226, 191, 116, 0.62); }
      #soundToggle[aria-pressed="false"] .wave { display: none; }
      #soundToggle[aria-pressed="false"] .mute { display: inline; }

      /* ---------- the gate: the closed book waits under a warm, dark veil (darkest at the edges,
         the candle-lit desk still glowing through it) for the gesture that opens it, with sound.
         In the true centre of the screen (clear of the notch and the home bar), where the loader
         was: as the loader's roundel swells and fades, the gate comes up in its place. One gilt
         object of the clasp's family, the words in ink small caps on gold leaf, and nothing under
         it: the plate alone sits on the loader's spot. While it waits, a glint crosses the gold
         now and then and its candle halo breathes. Pressed, it swells a hair and dissolves as the
         veil clears and the cover begins to lift: one gesture. The gold-leaf plate, a fine double
         rule engraved into it, a warm glow behind. ---------- */
      #gateVeil {
        position: fixed; inset: 0; z-index: 9; pointer-events: none;
        background:
          radial-gradient(closest-side, rgba(255, 196, 120, 0.075), rgba(255, 196, 120, 0.03) 55%, transparent) 50% 50% / min(92vmin, 760px) min(70vmin, 560px) no-repeat,
          radial-gradient(ellipse 78% 74% at 50% 50%, rgba(12, 6, 3, 0.34) 0%, rgba(10, 5, 2, 0.6) 58%, rgba(6, 3, 1, 0.86) 100%);
        /* cleared over the light coming up and the cover's first lift (it starts 0.7 s after the tap) */
        transition: opacity 1.6s cubic-bezier(0.42, 0, 0.3, 1);
      }
      #gateVeil.gone { opacity: 0; }
      #gateVeil[hidden] { display: none; }
      #gate {
        position: fixed; z-index: 11;
        left: calc(50% + (env(safe-area-inset-left) - env(safe-area-inset-right)) / 2);
        top: calc(50% + (env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 2);
        translate: -50% -50%; scale: 0.97;
        display: grid;
        opacity: 0; transition: opacity 0.3s var(--ease-out), scale 0.3s var(--ease-out);
        -webkit-tap-highlight-color: transparent;
      }
      #gate[hidden] { display: none; }
      /* coming up while the loader goes (its roundel fades over 0.6 s) */
      #gate.shown { opacity: 1; scale: 1; transition: opacity 0.9s var(--ease-out) 0.25s, scale 1.1s var(--ease-out) 0.25s; }
      #gate.waiting { cursor: progress; }
      /* pressed: a hair larger and gone, as the loader's roundel goes */
      #gate.go { opacity: 0; scale: 1.05; transition: opacity 0.5s var(--ease-out), scale 0.6s var(--ease-out); pointer-events: none; }
      /* the one object: the plate and whatever grows from it; it carries the halo and the focus ring */
      #gate .obj { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 16px; transition: translate 0.25s var(--ease-out); }
      #gate .obj::before {
        content: ""; position: absolute; inset: -26px -40px; border-radius: 50%; z-index: -1; pointer-events: none;
        background: radial-gradient(closest-side, rgba(246, 221, 156, 0.24), rgba(246, 221, 156, 0.07) 62%, transparent);
        opacity: 0.75;
      }
      #gate .leaf {
        position: relative; overflow: hidden; display: grid; place-items: center;
        height: 54px; padding: 0 40px; border-radius: 14px;
        background: linear-gradient(160deg, #f7e1a2 0%, #d7ac58 42%, #a8792f 70%, #e6c477 100%);
        box-shadow:
          0 0 0 1px rgba(110, 70, 25, 0.55),
          inset 0 1px 0 rgba(255, 248, 220, 0.65), inset 0 -1px 1px rgba(80, 45, 10, 0.45),
          0 2px 3px rgba(20, 10, 3, 0.55), 0 10px 24px rgba(10, 5, 2, 0.5);
      }
      /* the glint: a soft band of light crossing the gold leaf */
      #gate .leaf::after {
        content: ""; position: absolute; inset: -40% auto -40% -60%; width: 40%; rotate: 18deg; pointer-events: none; z-index: 2;
        background: linear-gradient(90deg, transparent, rgba(255, 250, 228, 0.55), transparent);
        translate: -100% 0; opacity: 0;
      }
      #gate .label {
        position: relative; z-index: 1; padding-bottom: 0.12em; white-space: nowrap;
        font-size: 22px; font-weight: 600; letter-spacing: 0.09em; font-variant-caps: all-small-caps;
        color: var(--ink); text-shadow: 0 1px 0 rgba(255, 240, 200, 0.45);
      }
      /* the double rule engraved into the gold (a dark cut, lit on its lower lip) */
      #gate .rules {
        display: block; position: absolute; inset: 5px; border-radius: 9.5px; pointer-events: none;
        border: 1px solid rgba(96, 58, 20, 0.5);
        box-shadow: 0 1px 0 rgba(255, 246, 214, 0.5), inset 0 1px 0 rgba(255, 246, 214, 0.35);
        outline: 1px solid rgba(96, 58, 20, 0.38); outline-offset: -5px;
      }
      #gate.shown:not(.waiting) .leaf::after { animation: gate-glint 5.5s var(--ease) 2.2s infinite; }
      #gate.shown:not(.waiting) .obj::before { animation: gate-halo 3.2s ease-in-out 1.4s infinite alternate; }
      @keyframes gate-glint { 0% { translate: -100% 0; opacity: 0; } 8% { opacity: 1; } 30% { translate: 560% 0; opacity: 0; } 100% { translate: 560% 0; opacity: 0; } }
      @keyframes gate-halo { from { opacity: 0.75; } to { opacity: 1; } }
      /* not ready yet (the desk still being built): the gold dimmed, the words quieter, no glint */
      #gate.waiting .obj { filter: saturate(0.55) brightness(0.72); }
      #gate.waiting .label { opacity: 0.55; }
      @media (hover: hover) and (pointer: fine) {
        #gate:not(.waiting):hover .obj { translate: 0 -1px; }
        #gate:not(.waiting):hover .leaf { filter: brightness(1.06); }
      }
      #gate:not(.waiting):active .obj { translate: 0 1px; transition-duration: 0.06s; }
      #gate:focus-visible { outline: none; }
      #gate:focus-visible .obj { outline: 2px solid var(--gold-hi); outline-offset: 6px; }

      /* page controls: Wstęp, a page number, Koniec. The label fits the widest word of its language
         (Koniec, The End), so the plaque never shifts as pages turn; the arrows stand in narrow
         columns, their 44 px touch targets reaching over the padding and the label (which lets
         every tap through to them) */
      .nav { padding: 0 var(--pad); gap: 0; }
      .nav .ctl { min-width: 32px; }
      #indicator {
        position: relative; z-index: 1; min-width: 3em; padding: 0 4px; text-align: center; white-space: nowrap; pointer-events: none;
        font-size: 18px; font-style: italic; color: var(--text);
        font-variant-numeric: tabular-nums lining-nums;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
      }
      html[lang="en"] #indicator { min-width: 3.75em; }
      /* the length of the tale, quieter than the page being read */
      #indicator .of { margin-left: 0.3em; font-size: 15px; color: rgba(241, 226, 194, 0.58); }
      #indicator .of:empty { display: none; }
      /* a gilt hairline under the words: how far into the tale */
      #indicator::after {
        content: ""; position: absolute; left: 12%; bottom: -1px; height: 1px; width: calc(76% * var(--progress, 0));
        background: linear-gradient(90deg, rgba(226, 191, 116, 0.1), rgba(226, 191, 116, 0.6));
        transition: width 0.6s var(--ease);
      }

      /* ---------- hover: a control under the pointer rises a hair and warms, and light runs once
         along its gilt. Desktop only (no sticky hover after a tap); keyboard focus gets the same,
         so a control reads alike however it is reached; a press sets the plaque back down.
         One pattern for every plaque (sound, language, pages) and its controls;
         the clasp on the last page rises and warms the same way. ---------- */
      .plaque::after {
        /* the glint: a soft band of candlelight, parked past the left edge until it runs */
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 224, 160, 0.2) 50%, transparent 62%) 100% 0 / 250% 100% no-repeat;
      }
      @keyframes glint {
        from { opacity: 1; background-position: 100% 0; }
        to { opacity: 1; background-position: 0 0; }
      }
      @media (hover: hover) and (pointer: fine) {
        .plaque:hover { translate: 0 -1px; --lift-shadow: 0 3px 4px rgba(0, 0, 0, 0.38), 0 12px 24px rgba(0, 0, 0, 0.36); }
        .plaque:hover::before { box-shadow: inset 0 0 0 1px rgba(236, 200, 128, 0.78); }
        .plaque:hover::after { animation: glint 0.8s var(--ease-out); }
        .ctl:hover:not(:disabled, [aria-disabled="true"], [aria-pressed="true"]), #soundToggle:hover { color: var(--gold-hi); filter: drop-shadow(0 0 4px rgba(246, 221, 156, 0.4)); }
      }
      .plaque:has(:focus-visible) { translate: 0 -1px; --lift-shadow: 0 3px 4px rgba(0, 0, 0, 0.38), 0 12px 24px rgba(0, 0, 0, 0.36); }
      .plaque:has(:focus-visible)::before { box-shadow: inset 0 0 0 1px rgba(236, 200, 128, 0.78); }
      .plaque:has(:focus-visible)::after { animation: glint 0.8s var(--ease-out); }
      .plaque:has(.ctl:active:not(:disabled, [aria-disabled="true"])) { translate: 0 0; --lift-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 5px 14px rgba(0, 0, 0, 0.3); }

      #perf {
        position: fixed; top: 10px; left: 10px; z-index: 30; padding: 6px 9px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.6); color: #cfe8c8; font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none;
      }
      /* screen-reader mirror of the spread; its buttons (choices, tale ribbons) surface when
         focused by keyboard: a choice as a small parchment label above the page controls, a
         ribbon's button as the ribbon's own tooltip (#ribbonTip) */
      .sr-only {
        position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      #mirror .choices button:focus {
        position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 40;
        width: max-content; max-width: min(86vw, 520px); height: auto; clip: auto; white-space: normal; margin: 0;
        padding: 11px 18px 11px 34px; border-radius: 10px; text-align: left;
        background: linear-gradient(180deg, #f4e7c8, #e4d0a4); color: var(--ink);
        box-shadow: 0 0 0 1px rgba(120, 82, 30, 0.55), inset 0 0 0 3px rgba(244, 231, 200, 0.9), inset 0 0 0 4px rgba(176, 128, 52, 0.55), 0 8px 22px rgba(0, 0, 0, 0.45);
        font: 600 18px/1.25 "EB Garamond", serif; outline: none;
      }
      #mirror .choices button:focus::before {
        content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; translate: 0 -50%; rotate: 45deg;
        background: var(--ribbon, #962a1f); box-shadow: 0 0 0 1px rgba(176, 128, 52, 0.8);
      }
      #mirror .choices, #taleNav { position: static; }

      /* ---------- the ribbon tooltip: what a ribbon marks, on a small plaque like the page controls.
         Under the pointer on a desktop (a short wait, so it never flickers past), or when the
         ribbon's button is focused from the keyboard; main.js names the tale and places it clear
         of the ribbon. It rises a hair as it appears and goes almost at once. ---------- */
      #ribbonTip {
        position: fixed; left: 0; top: 0; z-index: 12; --h: 32px; --r: 11px; padding: 0 14px; pointer-events: none;
        white-space: nowrap; font-size: 17px; line-height: 1; color: var(--text); text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        opacity: 0; visibility: hidden; translate: 0 3px;
        transition: opacity 0.1s var(--ease-out), translate 0.1s var(--ease-out), visibility 0s linear 0.1s;
      }
      #ribbonTip span { position: relative; padding-bottom: 0.08em; }
      #ribbonTip.shown {
        opacity: 1; visibility: visible; translate: 0 0;
        transition: opacity 0.18s var(--ease-out) 0.25s, translate 0.22s var(--ease-out) 0.25s, visibility 0s linear 0.25s;
      }
      /* moving on from one ribbon to the next: the plaque follows at once */
      #ribbonTip.shown.instant { transition-delay: 0s; }
      /* a tale not written yet: quieter, in italic */
      #ribbonTip.soon { font-style: italic; color: rgba(241, 226, 194, 0.62); }
      /* the hover tooltip never on a touch screen (the keyboard one may be) */
      @media (hover: none), (pointer: coarse) { #ribbonTip.hover { display: none; } }

      /* ---------- the clasp: "begin again" on a tale's last page. The page prints it, so it rides
         the leaf through every turn; once the page lies still, a real button is raised over the
         print (main.js lays it onto the page as the camera sees it): a sibling of the language
         label, the same gold leaf and corners, lit along its top, shaded at its foot, standing off
         the paper on its own shadow. Under the pointer (or when its line in the mirror has
         keyboard focus) it rises and warms; pressed, it sinks back onto the page.
         Steady by construction: the button's box never moves (only the face inside it rises, so
         the pointer cannot slip off its edge), its hover has a little give, it sits on a layer of
         its own, and every change is opacity or transform, nothing that redraws it. Under the vignette, like the rest of the desk. */
      #clasp {
        position: fixed; left: 0; top: 0; z-index: 1; transform-origin: 0 0; will-change: transform;
        /* gone at once when the page moves (never left floating over a turning leaf), fading in
           as the page comes to rest */
        opacity: 0; visibility: hidden;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      #clasp.shown { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease-out); }
      /* hover with a little give: once under the pointer, the button reaches 8 px further, so the
         camera's slow breath (the page drifts a few px) never carries its edge out from under a
         resting pointer */
      #clasp::after { content: ""; position: absolute; inset: 0; }
      #clasp:hover::after { inset: -8px; }
      #clasp .face {
        position: absolute; inset: 0; border-radius: var(--clasp-r, 13px);
        background: linear-gradient(160deg, #f7e1a2 0%, #d7ac58 42%, #a8792f 70%, #e6c477 100%);
        box-shadow:
          0 0 0 1px rgba(110, 70, 25, 0.45),
          inset 0 1px 0 rgba(255, 248, 220, 0.6), inset 0 -1px 1px rgba(80, 45, 10, 0.45),
          0 1px 2px rgba(46, 22, 6, 0.42), 0 3px 6px rgba(46, 22, 6, 0.26);
        transition: translate 0.2s var(--ease-out);
      }
      /* the deeper shadow of a raised plate, and the warmth (or, pressed, the shade) on its leaf:
         faded in and out, never redrawn */
      #clasp .face::before, #clasp .face::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; pointer-events: none;
        transition: opacity 0.2s var(--ease-out);
      }
      #clasp .face::before { box-shadow: 0 3px 3px rgba(46, 22, 6, 0.3), 0 8px 14px rgba(46, 22, 6, 0.3); }
      #clasp .face::after { background: rgba(255, 238, 190, 0.18); }
      #clasp svg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; }
      #clasp text { font-family: "EB Garamond", serif; font-weight: 600; font-kerning: none; }
      #clasp text.ink { fill: var(--ink); }
      #clasp text.edge { fill: rgba(255, 240, 200, 0.45); }
      @media (hover: hover) and (pointer: fine) {
        #clasp:hover .face { translate: 0 -1px; }
        #clasp:hover .face::before, #clasp:hover .face::after { opacity: 1; }
      }
      #clasp.focus .face { translate: 0 -1px; }
      #clasp.focus .face::before, #clasp.focus .face::after { opacity: 1; }
      #clasp:active .face { translate: 0 0.5px; transition-duration: 0.06s; }
      #clasp:active .face::before { opacity: 0; transition-duration: 0.06s; }
      #clasp:active .face::after { opacity: 1; background: rgba(70, 40, 10, 0.12); transition-duration: 0.06s; }

      @media (prefers-reduced-motion: reduce) {
        .chrome, .chrome.hidden, .chrome.bottom.hidden { translate: none; transition-property: opacity; }
        .seg .thumb, #indicator::after { transition-duration: 0.01s; }
        .ctl.wake { animation: none; }
        /* raised controls only warm: no rise, no running light */
        .plaque, .plaque:hover, .plaque:has(:focus-visible) { translate: none; }
        .plaque::after { animation: none !important; }
        #clasp .face, #clasp:hover .face, #clasp.focus .face, #clasp:active .face { translate: none; }
        /* the loader does not turn; it only breathes, and fades away with the veil */
        .seal .stars, .seal .rosette { animation: none; }
        .seal .glint { display: none; }
        .seal { animation: breathe 2.6s ease-in-out infinite alternate; }
        #veil.gone .seal, #veil.gone .loader::before { transform: none; }
        #ribbonTip, #ribbonTip.shown { translate: none; }
        #gate, #gate.shown, #gate.go { scale: none; }
        #gate .leaf::after, #gate .obj::before { animation: none !important; }
        #gateVeil { transition-duration: 0.6s; }
      }

      /* ---------- small screens (main.js pickMode sets html[data-mode]: spread | single | column
         | pan; data-layout="portrait" while the book is read one page at a time). Framed one
         page at a time, the ribbons lie mostly out of view (on a phone, all of them), so the
         tales hang as silk tabs from the top-left corner, in their ribbons' colours: #taleNav, a
         button for every tale that can be opened, the one being read hanging lower. A tap opens a
         tale as its ribbon does. They come in with the other controls. ---------- */
      html[data-layout="portrait"] #taleNav {
        position: fixed !important; z-index: 10; left: max(8px, env(safe-area-inset-left)); top: 0;
        width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal;
        display: flex; padding: env(safe-area-inset-top) 3px 0;
        /* the tabs share the room left of the sound and language plaques: 44 px each while it
           lasts, never under 40 (four fit a 375 px phone at 40 px) */
        --pitch: clamp(40px, calc((100vw - 206px - env(safe-area-inset-left) - env(safe-area-inset-right)) / var(--n, 2)), 44px);
        transition: opacity 0.7s var(--ease-out);
      }
      html[data-layout="portrait"]:has(#chromeTop.hidden) #taleNav { opacity: 0; pointer-events: none; }
      /* the headcap the ribbons hang from: a strip of the binding's leather, reaching up to the top
         edge of the screen, with a gilt fillet tooled along its foot, as on the plaques */
      html[data-layout="portrait"] #taleNav::before {
        content: ""; position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top) + 12px);
        border-radius: 0 0 8px 8px; pointer-events: none;
        background:
          radial-gradient(120% 140% at 30% -40%, rgba(255, 214, 150, 0.14), transparent 60%),
          linear-gradient(180deg, rgba(58, 36, 22, 0.72), rgba(26, 14, 7, 0.9)),
          url("/assets/book3d/textures/leather_diff.webp") center / 180px;
        background-blend-mode: normal, multiply, normal;
        box-shadow: 0 0 0 1px rgba(8, 4, 2, 0.9), inset 0 -3px 0 -2px rgba(226, 191, 116, 0.6), inset 0 -4px 0 -2px rgba(0, 0, 0, 0.4), 0 2px 3px rgba(0, 0, 0, 0.4), 0 5px 10px rgba(0, 0, 0, 0.25);
      }
      /* under it the headband, as at the head of a spine: a bead of silk worked in two dyes and
         gold over the core, which the ribbons come out from */
      html[data-layout="portrait"] #taleNav::after {
        content: ""; position: absolute; z-index: 3; left: 5px; right: 5px; top: calc(env(safe-area-inset-top) + 11px); height: 4px;
        border-radius: 0 0 2px 2px; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 240, 210, 0.35), transparent 45%, rgba(0, 0, 0, 0.45)),
          repeating-linear-gradient(90deg, #7a3026 0 2.2px, #d6b062 2.2px 3.3px, #3d5672 3.3px 5.5px, #d6b062 5.5px 6.6px);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      }
      /* each tab: a hit box the width of its share and 64 px tall, the ribbon in the middle of it */
      html[data-layout="portrait"] #taleNav button {
        position: relative; flex: none; display: block; width: var(--pitch); height: calc(env(safe-area-inset-top) + 64px);
        -webkit-tap-highlight-color: transparent;
      }
      html[data-layout="portrait"] #taleNav .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      #taleNav .silk { display: none; }
      /* the silk itself (main.js, silkTab): drawn out from under the headcap for the tale being read,
         the others tucked up; a press tugs a ribbon down a little */
      html[data-layout="portrait"] #taleNav .silk {
        display: block; position: absolute; left: 50%; top: env(safe-area-inset-top); width: 28px; height: 62px;
        translate: -50% -13px; transition: translate 0.45s var(--ease-out);
        filter: drop-shadow(0 1.5px 1px rgba(0, 0, 0, 0.5)) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.32));
      }
      html[data-layout="portrait"] #taleNav button[aria-current="true"] .silk { translate: -50% 0; }
      html[data-layout="portrait"] #taleNav button:not([aria-current="true"]):active .silk { translate: -50% -8px; transition-duration: 0.12s; }
      #taleNav .silk svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #taleNav .silk .dye { fill: var(--ribbon, #7a3026); }
      #taleNav .silk .thread { fill: none; stroke: var(--ribbon, #7a3026); stroke-width: 0.6; stroke-linecap: round; opacity: 0.75; }
      @media (hover: hover) and (pointer: fine) {
        html[data-layout="portrait"] #taleNav button:not([aria-current="true"]):hover .silk { translate: -50% -9px; }
      }
      html[data-layout="portrait"] #taleNav button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: -2px; border-radius: 6px; }

      /* ---------- the notice over the dimmed desk when the WebGL context is lost (#glLost,
         main.js): one plaque, centred, in the book's italic; the reload is a gold-leaf label like
         the chosen language. ---------- */
      .notice-layer {
        position: fixed; inset: 0; z-index: 15; display: grid; place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: rgba(11, 6, 4, 0.6);
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: opacity 0.6s var(--ease-out), visibility 0s linear 0.6s;
      }
      .notice-layer.shown {
        opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.6s var(--ease-out);
      }
      #glLost { z-index: 30; background: rgba(11, 6, 4, 0.74); }
      .notice {
        height: auto; min-height: 48px; max-width: 460px; gap: 12px; padding: 7px 18px;
        font-size: 19px; font-style: italic; line-height: 1.25; color: var(--text); text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
      }
      .notice:has(.leaf) { padding-right: 7px; }
      .notice > * { position: relative; z-index: 1; }
      .notice svg { flex: none; width: 26px; height: 26px; color: var(--gold); }
      .notice .leaf {
        flex: none; height: 34px; padding: 0 14px 0.15em; border-radius: calc(var(--r) - var(--pad) - 2px);
        background: linear-gradient(160deg, #f7e1a2 0%, #d7ac58 42%, #a8792f 70%, #e6c477 100%);
        box-shadow: inset 0 1px 0 rgba(255, 248, 220, 0.6), inset 0 -1px 1px rgba(80, 45, 10, 0.5), 0 1px 2px rgba(0, 0, 0, 0.45);
        color: var(--ink); text-shadow: 0 1px 0 rgba(255, 240, 200, 0.45);
        font-style: normal; font-weight: 600; font-size: 17px; letter-spacing: 0.08em; font-variant-caps: all-small-caps;
        transition: translate 0.06s ease-out;
      }
      .notice .leaf::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: 44px; translate: -50% -50%; }
      .notice .leaf:active { translate: 0 0.5px; }
      .notice .leaf:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
      /* ---------- pan reading (a phone held sideways reads a part of a spread at a time,
         main.js, data-mode="pan"). The controls keep to the corners, so the part in view takes
         the screen's full height between them: the page controls go back to the bottom-right
         corner, and under the page number a row of gilt dots shows the stops of the spread, the
         one in view lit (it stands in for the hairline of the tale's progress). ---------- */
      #stops { display: none; }
      html[data-mode="pan"] .bottom { left: auto; right: max(10px, env(safe-area-inset-right)); transform: none; }
      html[data-mode="pan"] #indicator { translate: 0 -3px; }
      html[data-mode="pan"] #indicator::after { display: none; }
      html[data-mode="pan"] #stops {
        position: absolute; z-index: 1; left: 50%; bottom: 5px; translate: -50% 0;
        display: flex; gap: 5px; pointer-events: none;
      }
      #stops i {
        width: 4px; height: 4px; border-radius: 50%; background: rgba(226, 191, 116, 0.3);
        transition: background-color 0.45s var(--ease), box-shadow 0.45s var(--ease);
      }
      #stops i.on { background: var(--gold-hi); box-shadow: 0 0 4px rgba(246, 221, 156, 0.6); }
      @media (prefers-reduced-motion: reduce) {
        #stops i { transition: none; }
        #taleNav .silk { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <!-- raised over the printed clasp on a tale's last page (main.js); screen readers and the
         keyboard use the restart button in the mirror instead -->
    <div id="clasp" aria-hidden="true"></div>
    <div id="vignette"></div>
    <!-- the gate: the closed book waits under a veil for the gesture that opens it, with sound
         (main.js, "intro"); its words and name follow the book's language (syncChrome). First in
         the tab order: the controls behind it are not shown yet -->
    <div id="gateVeil" hidden></div>
    <button type="button" id="gate" hidden>
      <span class="obj">
        <span class="leaf"><span class="rules"></span><span class="label"></span></span>
      </span>
    </button>
    <!-- a lost WebGL context, with a reload at the same page -->
    <div id="glLost" class="notice-layer" role="alert">
      <div class="plaque notice"><span id="glLostText"></span><button type="button" class="leaf" id="glReload"></button></div>
    </div>

    <div class="chrome top hidden" id="chromeTop">
      <!-- sound on / off (main.js syncSound): the arcs of sound while on, a small cross while off -->
      <div class="plaque round">
        <button type="button" class="ctl" id="soundToggle" aria-pressed="true" aria-label="Dźwięk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.6 9.6h2.9l4.1-3.4v11.6l-4.1-3.4H4.6z" /><path class="wave" d="M14.9 9.4a3.7 3.7 0 0 1 0 5.2" /><path class="wave" d="M17.4 7.1a7 7 0 0 1 0 9.8" /><path class="mute" d="M15.4 9.8l4.4 4.4M19.8 9.8l-4.4 4.4" /></svg>
        </button>
      </div>
      <div class="plaque seg" role="group" id="langGroup" aria-label="Język" data-lang="pl">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" class="ctl" data-lang="pl" aria-pressed="true">PL</button>
        <button type="button" class="ctl" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <nav class="chrome bottom hidden" id="chromeBottom" aria-label="Strony">
      <div class="plaque nav">
        <button type="button" class="ctl" id="prev" aria-label="Poprzednia strona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5" /></svg>
        </button>
        <span id="indicator" aria-live="polite"><span id="pageSr" class="sr-only">Strona tytułowa</span><span aria-hidden="true"><span id="pageNow">Wstęp</span><span id="pageOf" class="of"></span></span></span>
        <span id="stops" aria-hidden="true"></span>
        <button type="button" class="ctl" id="next" aria-label="Następna strona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" /></svg>
        </button>
      </div>
    </nav>

    <!-- the ribbon tooltip (main.js); the ribbons' buttons in #taleNav carry their names for screen readers -->
    <div id="ribbonTip" class="plaque" aria-hidden="true"><span></span></div>

    <main id="mirror" class="sr-only" aria-live="polite"></main>
    <nav id="taleNav" class="sr-only"></nav>
    <!-- the silk tabs' weave, light and gold-thread motifs (main.js silkTab; motifs as ribbons.js) -->
    <svg id="silkDefs" width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <defs>
        <clipPath id="silkCut"><path d="M0 0H28V62L14 54L0 62Z" /></clipPath>
        <pattern id="silkWarp" width="1.5" height="10" patternUnits="userSpaceOnUse"><rect width="0.5" height="10" fill="rgba(255,235,200,0.08)" /><rect x="0.75" width="0.4" height="10" fill="rgba(0,0,0,0.09)" /></pattern>
        <pattern id="silkRibs" width="10" height="1.1" patternUnits="userSpaceOnUse"><rect width="10" height="0.4" fill="rgba(0,0,0,0.11)" /></pattern>
        <pattern id="silkStitch" width="1.3" height="1.3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="0.42" height="1.3" fill="rgba(90,55,20,0.5)" /></pattern>
        <linearGradient id="silkSheen" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="0.22" /><stop offset="0.22" stop-color="#fff2d8" stop-opacity="0.05" /><stop offset="0.4" stop-color="#fff2d8" stop-opacity="0.24" /><stop offset="0.52" stop-color="#fff2d8" stop-opacity="0.06" /><stop offset="0.8" stop-color="#000" stop-opacity="0.04" /><stop offset="1" stop-color="#000" stop-opacity="0.28" />
        </linearGradient>

          <stop offset="0" stop-color="#000" stop-opacity="0.55" /><stop offset="0.26" stop-color="#000" stop-opacity="0" /><stop offset="0.66" stop-color="#ffe6be" stop-opacity="0.07" /><stop offset="1" stop-color="#000" stop-opacity="0.14" />
        </linearGradient>
        <linearGradient id="silkGold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f2d688" /><stop offset="0.5" stop-color="#c3923e" /><stop offset="1" stop-color="#e7c472" /></linearGradient>
        <symbol id="motif-flame" viewBox="-1 -1 2 2"><path d="M0 -1C0.25 -0.45 0.75 -0.1 0.55 0.45C0.4 0.85 -0.4 0.85 -0.55 0.45C-0.7 0.05 -0.2 -0.2 0 -1Z" /></symbol>
        <symbol id="motif-bell" viewBox="-1 -1 2 2"><path d="M-0.12 -0.85L0.12 -0.85C0.55 -0.65 0.45 0.1 0.75 0.5L-0.75 0.5C-0.45 0.1 -0.55 -0.65 -0.12 -0.85ZM0.16 0.72A0.16 0.16 0 1 1 -0.16 0.72A0.16 0.16 0 1 1 0.16 0.72Z" /></symbol>
        <symbol id="motif-star" viewBox="-1 -1 2 2"><path d="M0 -0.95L0.21 -0.364L0.823 -0.475L0.42 0L0.823 0.475L0.21 0.364L0 0.95L-0.21 0.364L-0.823 0.475L-0.42 0L-0.823 -0.475L-0.21 -0.364Z" /></symbol>
        <symbol id="motif-trefoil" viewBox="-1 -1 2 2"><path d="M0.36 -0.42A0.36 0.36 0 1 1 -0.36 -0.42A0.36 0.36 0 1 1 0.36 -0.42ZM-0.04 0.05A0.36 0.36 0 1 1 -0.76 0.05A0.36 0.36 0 1 1 -0.04 0.05ZM0.76 0.05A0.36 0.36 0 1 1 0.04 0.05A0.36 0.36 0 1 1 0.76 0.05ZM-0.08 0.2L0.08 0.2L0.05 0.95L-0.05 0.95Z" /></symbol>
      </defs>
    </svg>
    <!-- the loader (styles above); screen readers hear "Ładowanie…" / "Loading…" in the book's language -->
    <div id="veil">
      <div class="loader" role="status">
        <div class="seal" aria-hidden="true">
          <!-- the gold-leaf ring with its punched dots (still) -->
          <svg viewBox="-56 -56 112 112">
            <defs>
              <linearGradient id="veilGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f6dd9c" /><stop offset="0.45" stop-color="#c99a4a" /><stop offset="0.7" stop-color="#8f6427" /><stop offset="1" stop-color="#e2bf74" />
              </linearGradient>
              <linearGradient id="veilGlint" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff3cf" stop-opacity="0" /><stop offset="0.15" stop-color="#fff3cf" stop-opacity="0.85" /><stop offset="0.32" stop-color="#fff3cf" stop-opacity="0" />
              </linearGradient>
            </defs>
            <g fill="none">
              <circle r="42" stroke="url(#veilGold)" stroke-width="1.8" />
              <circle r="37.6" stroke="url(#veilGold)" stroke-width="0.8" />
              <circle r="39.8" stroke="#f6dd9c" stroke-opacity="0.7" stroke-width="1.3" stroke-linecap="round" pathLength="36" stroke-dasharray="0 1" />
              <circle r="25.5" stroke="#e2bf74" stroke-opacity="0.45" stroke-width="0.6" />
            </g>

    <script>
      // the loader speaks the language the book opens in (main.js: ?lang=, else the one chosen
      // last, kept in localStorage under the site's key, else Polish)
      (() => {
        const q = new URLSearchParams(location.search).get("lang");
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem("bookOfMagicalTalesState") || "{}")?.language;
        } catch {}
        const lang = q === "en" || q === "pl" ? q : saved === "en" ? "en" : "pl";
        document.documentElement.lang = lang;
        const t = document.getElementById("loadingText");
        t.lang = lang;
        t.textContent = lang === "en" ? "Loading…" : "Ładowanie…";
      })();
    </script>
